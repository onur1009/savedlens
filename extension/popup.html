<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SavedLens Sync</title>
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --success: #10b981;
      --amber: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
    }

    .brand-name {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.3px;
    }

    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .status-badge.active {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .field-group {
      margin-bottom: 12px;
    }

    .field-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    label {
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .env-pills {
      display: flex;
      gap: 4px;
    }

    .env-pill {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
    }

    .env-pill:hover {
      border-color: var(--primary);
      color: var(--text);
    }

    input[type="text"] {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      margin-bottom: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .btn-secondary:hover {
      background: #27272a;
      color: var(--text);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .log-box {
      background: #121214;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      color: var(--text-muted);
      min-height: 50px;
      max-height: 90px;
      overflow-y: auto;
      margin-top: 10px;
      white-space: pre-wrap;
    }

    .footer {
      margin-top: 12px;
      text-align: center;
    }

    .footer a {
      color: #818cf8;
      text-decoration: none;
      font-size: 11px;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">S</div>
      <span class="brand-name">SavedLens Sync</span>
    </div>
    <span id="tab-status" class="status-badge">Kontrol ediliyor...</span>
  </div>

  <div class="field-group">
    <div class="field-header">
      <label for="server-url">SavedLens API URL</label>
      <div class="env-pills">
        <button id="pill-prod" class="env-pill">🌐 Vercel</button>
        <button id="pill-local" class="env-pill">💻 Local</button>
      </div>
    </div>
    <input type="text" id="server-url" value="https://savedlens.vercel.app" />
  </div>

  <button id="btn-sync" class="btn btn-primary" disabled>
    <span>📥</span> Instagram Kaydedilenleri Eşitle
  </button>

  <button id="btn-test-sync" class="btn btn-secondary">
    <span>⚡</span> Örnek Veri ile Test Eşitlemesi
  </button>

  <div id="log-box" class="log-box">Hazır. Instagram kaydedilenler sayfasına gidin veya test eşitlemesi yapın.</div>

  <div class="footer">
    <a id="link-dashboard" href="https://savedlens.vercel.app/dashboard" target="_blank">SavedLens Dashboard'u Aç ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
