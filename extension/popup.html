<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SavedLens Sync</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #12131c;
      --card-elevated: #1a1b28;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(99, 102, 241, 0.5);
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      --primary-hover: #4f46e5;
      --text: #f4f4f6;
      --text-muted: #8e8ea0;
      --success: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 330px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
      line-height: 1.4;
      user-select: none;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      background: var(--primary-gradient);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: white;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.4);
    }

    .brand-name {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.3px;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.12);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.25);
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-badge.active {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.25);
    }

    .status-badge.warning {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.25);
    }

    /* Context Card */
    .context-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .context-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--card-elevated);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .context-info {
      flex: 1;
      min-width: 0;
    }

    .context-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .context-sub {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Single Main Action Button */
    .btn-main {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--primary-gradient);
      color: white;
      box-shadow: 0 4px 18px rgba(99, 102, 241, 0.35);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-main:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(99, 102, 241, 0.45);
      filter: brightness(1.06);
    }

    .btn-main:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-main:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      filter: grayscale(0.2);
    }

    /* Secondary Auto-Scroll Action */
    .btn-secondary {
      width: 100%;
      margin-top: 8px;
      padding: 9px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-elevated);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover:not(:disabled) {
      border-color: rgba(99, 102, 241, 0.4);
      color: var(--text);
      background: rgba(99, 102, 241, 0.1);
    }

    .btn-secondary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Status Message & Feedback Card */
    .feedback-card {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 11px;
      line-height: 1.4;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.25s ease;
    }

    .feedback-card.success {
      display: flex;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .feedback-card.error {
      display: flex;
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
    }

    .feedback-card.info {
      display: flex;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #c7d2fe;
    }

    .feedback-text {
      flex: 1;
    }

    .feedback-link {
      color: #a5b4fc;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      white-space: nowrap;
      margin-left: 4px;
    }

    /* Collapsible Settings */
    .settings-toggle {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 0;
      transition: color 0.15s;
    }

    .settings-toggle:hover {
      color: var(--text);
    }

    .settings-panel {
      display: none;
      margin-top: 8px;
      padding: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 11px;
    }

    .settings-panel.open {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    .field-row {
      margin-bottom: 8px;
    }

    .field-row:last-child {
      margin-bottom: 0;
    }

    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      background: #090a0f;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      outline: none;
      font-family: inherit;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--primary);
    }

    .env-pills {
      display: flex;
      gap: 4px;
    }

    .env-pill {
      font-size: 9px;
      padding: 2px 5px;
      border-radius: 4px;
      background: var(--card-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
    }

    .env-pill.active {
      border-color: var(--primary);
      color: white;
      background: rgba(99, 102, 241, 0.2);
    }

    /* Footer */
    .footer {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .footer a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* Spinner */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Brand & Header -->
  <div class="header">
    <div class="brand">
      <div class="brand-icon">S</div>
      <span class="brand-name">SavedLens</span>
    </div>
    <span id="tab-status" class="status-badge">Kontrol Ediliyor...</span>
  </div>

  <!-- Smart Dynamic Context Card -->
  <div class="context-card">
    <div id="context-icon" class="context-icon">🌐</div>
    <div class="context-info">
      <div id="context-title" class="context-title">Aktif Sayfa Taranıyor...</div>
      <div id="context-sub" class="context-sub">Sayfa bilgileri çözümleniyor</div>
    </div>
  </div>

  <!-- THE PRIMARY BUTTON -->
  <button id="btn-main-action" class="btn-main" type="button">
    <span id="btn-icon">✨</span>
    <span id="btn-text">Kütüphaneme Kaydet</span>
  </button>

  <!-- Auto-scroll Collector Button (Only for Saved Grid) -->
  <button id="btn-autoscroll-action" class="btn-secondary" type="button" style="display:none;">
    <span id="autoscroll-icon">📜</span>
    <span id="autoscroll-text">Aşağı Kaydır & Hepsini Tara</span>
  </button>

  <!-- Clean Feedback Toast / Card -->
  <div id="feedback-card" class="feedback-card">
    <span id="feedback-icon">✓</span>
    <span id="feedback-text" class="feedback-text">İşlem başarıyla tamamlandı.</span>
  </div>

  <!-- Collapsible Settings (Hidden by default) -->
  <div id="settings-toggle" class="settings-toggle">
    <span>⚙️ Bağlantı Ayarları</span>
    <span id="toggle-arrow">▾</span>
  </div>

  <div id="settings-panel" class="settings-panel">
    <div class="field-row">
      <div class="field-label">
        <span>Sunucu</span>
        <div class="env-pills">
          <button id="pill-prod" class="env-pill active" type="button">Canlı (Vercel)</button>
          <button id="pill-local" class="env-pill" type="button">Localhost</button>
        </div>
      </div>
      <input type="text" id="server-url" value="https://savedlens.vercel.app" />
    </div>
    <div class="field-row">
      <div class="field-label">
        <span>Kişisel Token (Opsiyonel)</span>
        <span id="token-status" style="color:var(--success);">Otomatik Bağlı ✓</span>
      </div>
      <input type="password" id="sync-token" value="" placeholder="Oturumunuz otomatik tanınır..." />
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span>SavedLens İkinci Beyin</span>
    <a id="link-dashboard" href="https://savedlens.vercel.app/dashboard" target="_blank">Kütüphaneyi Aç ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
