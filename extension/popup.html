<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SavedLens Sync Extension</title>
  <style>
    :root {
      --bg: #0d0d12;
      --card: #15151e;
      --card-elevated: #1e1e2c;
      --border: #28283a;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f4f4f6;
      --text-muted: #9494a8;
      --success: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
      line-height: 1.4;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: white;
      box-shadow: 0 0 14px rgba(99, 102, 241, 0.45);
    }

    .brand-title {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.3px;
    }

    .brand-sub {
      font-size: 10px;
      color: var(--text-muted);
    }

    .status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      max-width: 130px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-badge.active {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .status-badge.warning {
      background: rgba(245, 158, 11, 0.15);
      color: var(--amber);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .field-group {
      margin-bottom: 10px;
    }

    .field-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    label {
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .env-pills {
      display: flex;
      gap: 4px;
    }

    .env-pill {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .env-pill:hover, .env-pill.active {
      border-color: var(--primary);
      color: var(--text);
      background: var(--card-elevated);
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--primary);
    }

    .action-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 12px;
    }

    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-emerald {
      background: #059669;
      color: white;
    }

    .btn-emerald:hover:not(:disabled) {
      background: #047857;
    }

    .btn-secondary {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--card-elevated);
      color: var(--text);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .log-box {
      background: #09090d;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: var(--text-muted);
      min-height: 52px;
      max-height: 90px;
      overflow-y: auto;
      margin-top: 12px;
      white-space: pre-wrap;
      line-height: 1.4;
    }

    .footer {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }

    .footer a {
      color: #818cf8;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">S</div>
      <div class="brand-title">
        <span class="brand-name">SavedLens</span>
        <span class="brand-sub">Akıllı Senkronizasyon</span>
      </div>
    </div>
    <span id="tab-status" class="status-badge">Kontrol Ediliyor</span>
  </div>

  <!-- Sunucu Seçimi -->
  <div class="field-group">
    <div class="field-header">
      <label for="server-url">SavedLens Sunucusu</label>
      <div class="env-pills">
        <button id="pill-prod" class="env-pill active" type="button">🌐 Vercel</button>
        <button id="pill-local" class="env-pill" type="button">💻 Local</button>
      </div>
    </div>
    <input type="text" id="server-url" value="https://savedlens.vercel.app" />
  </div>

  <!-- Eşitleme Tokeni -->
  <div class="field-group">
    <div class="field-header">
      <label for="sync-token">Kişisel Eşitleme Anahtarı</label>
      <span id="token-status" style="font-size:10px; color:var(--success);">Bağlı ✓</span>
    </div>
    <input type="password" id="sync-token" value="6f5cfc25-3063-4084-a610-2ec60705fe00" placeholder="Token giriniz..." />
  </div>

  <!-- Aksiyon Butonları -->
  <div class="action-group">
    <button id="btn-save-tab" class="btn btn-primary" type="button">
      <span>✨</span> Aktif Sekmeyi SavedLens'e Kaydet
    </button>

    <button id="btn-sync-instagram" class="btn btn-emerald" type="button">
      <span>📥</span> Instagram Kaydedilenleri Eşitle
    </button>

    <button id="btn-test-sync" class="btn btn-secondary" type="button">
      <span>⚡</span> Test Bağlantısı Gönder (Doğrula)
    </button>
  </div>

  <!-- Konsol Çıktısı -->
  <div id="log-box" class="log-box">Hazır. Aktif sekmeyi kaydetmek veya test göndermek için butonlara tıklayın.</div>

  <div class="footer">
    <a id="link-sync-settings" href="https://savedlens.vercel.app/dashboard/settings/sync" target="_blank">Ayarlar ↗</a>
    <a id="link-dashboard" href="https://savedlens.vercel.app/dashboard" target="_blank">Kütüphaneyi Aç ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
